{# Params: bars (Bar: label, count = score out of 5, percent). The same SVG bars as reports/_bars.html. #}
{% load l10n %}
<ul class="dist">
  {% for bar in bars %}
  <li class="dist-line">
    <span class="label">{{ bar.label }}</span>
    <svg class="bar" viewBox="0 0 100 10" preserveAspectRatio="none"><rect class="bar-track" width="100" height="10"/><rect class="bar-val" width="{{ bar.percent|unlocalize }}" height="10"/></svg>
    <span class="num">{{ bar.count|floatformat:1 }}</span>
  </li>
  {% endfor %}
</ul>
