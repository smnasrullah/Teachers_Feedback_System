{# Params: label, variant (primary|ghost|danger), href, type, icon, full_width, disabled, open (dialog selector), close #}
{% load ui %}{% if href %}<a class="btn btn-{{ variant|default:'primary' }}{% if full_width %} btn-block{% endif %}" href="{{ href }}"{% if disabled %} aria-disabled="true" tabindex="-1"{% endif %}>{% if icon %}{% icon icon %}{% endif %}{{ label }}</a>{% else %}<button type="{{ type|default:'button' }}" class="btn btn-{{ variant|default:'primary' }}{% if full_width %} btn-block{% endif %}"{% if disabled %} disabled{% endif %}{% if open %} data-open="{{ open }}" aria-haspopup="dialog"{% endif %}{% if close %} data-close{% endif %}>{% if icon %}{% icon icon %}{% endif %}{{ label }}</button>{% endif %}
