{# The live clock: static/js/clock.js fills it in Asia/Dhaka time from the server's clock. #}
{% load i18n %}<span class="live-clock" data-clock hidden><span class="live-clock-date" data-clock-date aria-hidden="true"></span><b class="live-clock-time num" data-clock-time aria-hidden="true"></b><span class="sr-only" data-clock-sr></span></span>
