{# Params: id, name, label, value, hint, error, required, disabled, rows, maxlength #}
<div class="field">
  {% include "components/field_head.html" %}
  <textarea class="textarea" id="{{ id }}" name="{{ name }}" rows="{{ rows|default:4 }}"{% if maxlength %} maxlength="{{ maxlength }}"{% endif %}{% if required %} required{% endif %}{% if disabled %} disabled{% endif %}{% if error %} aria-invalid="true"{% endif %}{% if hint or error %} aria-describedby="{% if hint %}{{ id }}-hint {% endif %}{% if error %}{{ id }}-error{% endif %}"{% endif %}>{{ value|default_if_none:'' }}</textarea>
  {% include "components/field_foot.html" %}
</div>
