{# Params: id, name, label, type, value, hint, error, required, disabled, placeholder, autocomplete #}
<div class="field">
  {% include "components/field_head.html" %}
  <input class="input" id="{{ id }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value|default_if_none:'' }}"{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}{% if required %} required{% endif %}{% if disabled %} disabled{% endif %}{% if error %} aria-invalid="true"{% endif %}{% if hint or error %} aria-describedby="{% if hint %}{{ id }}-hint {% endif %}{% if error %}{{ id }}-error{% endif %}"{% endif %}>
  {% include "components/field_foot.html" %}
</div>
