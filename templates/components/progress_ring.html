{# Params: done, total #}
{% load i18n %}{% widthratio done total 100 as percent %}
<div class="progress-ring" role="img" aria-label="{% blocktranslate %}{{ done }} of {{ total }} done{% endblocktranslate %}">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <circle class="track" cx="50" cy="50" r="45"/>
    <circle class="val" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="{{ percent }} 100"/>
  </svg>
  <div class="label"><b class="num">{{ done }}/{{ total }}</b><span class="text-xs text-muted">{% translate "done" %}</span></div>
</div>
