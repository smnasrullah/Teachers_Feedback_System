{# Params: moment, to (ISO UTC), label, done_label. static/js/clock.js ticks it; the text inside is the no-JavaScript fallback. #}
{% load i18n %}<span class="live-countdown" data-countdown-to="{{ to }}" data-countdown-label="{{ label }}" data-countdown-done="{{ done_label }}" data-countdown-days="{% translate 'd' context 'days, abbreviated' %}" data-countdown-sr="{% translate '{days} days, {hours} hours, {minutes} minutes' %}"><span class="live-countdown-label">{{ label }}</span> <b class="live-countdown-value num" data-countdown-text aria-hidden="true">{{ moment|timeuntil }}</b><span class="sr-only" data-countdown-sr-text>{{ label }} {{ moment|timeuntil }}</span></span>
