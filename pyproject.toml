[tool.ruff]
line-length = 100
target-version = "py312"
# The one-off report and slide builders in the root are not part of the app.
extend-exclude = [
    "migrations",
    "static",
    "design",
    "build_presentation.py",
    "build_project_report.py",
    "polish_existing_report.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"config/settings/dev.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --strict-markers"
markers = ["postgres: needs PostgreSQL row locks; skipped on other databases"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
