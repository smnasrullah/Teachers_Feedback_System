# Lint, tests, production deploy checks and an image build on every push and pull request.
# Uses no repository secrets and deploys nothing; throwaway keys are generated per run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tfs
          POSTGRES_USER: tfs
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tfs -d tfs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tfs:ci-only-database-password@localhost:5432/tfs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core

      - name: Install Python packages
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (PostgreSQL)
        run: pytest -q

      - name: Deploy checks with production settings
        run: |
          export DJANGO_SETTINGS_MODULE=config.settings.prod DJANGO_READ_ENV_FILE=false
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export FIELD_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export BLIND_INDEX_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export DJANGO_ALLOWED_HOSTS=feedback.example.edu
          export DJANGO_CSRF_TRUSTED_ORIGINS=https://feedback.example.edu SITE_URL=https://feedback.example.edu
          export CACHE_URL=redis://localhost:6379/2 CELERY_BROKER_URL=redis://localhost:6379/0
          export CELERY_RESULT_BACKEND=redis://localhost:6379/1
          python manage.py check --deploy --fail-level WARNING

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build the production image (not pushed)
        run: docker build --tag tfs-app:ci .

      - name: Validate the production compose file
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config --quiet
